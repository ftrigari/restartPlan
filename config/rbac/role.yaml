---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - restart.example.com
  resources:
  - restartplans
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - restart.example.com
  resources:
  - restartplans/finalizers
  verbs:
  - update
- apiGroups:
  - restart.example.com
  resources:
  - restartplans/status
  verbs:
  - get
  - patch
  - update
