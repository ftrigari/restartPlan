# This rule is not used by the project restartplan itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to restart.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: restartplan
    app.kubernetes.io/managed-by: kustomize
  name: restartplan-viewer-role
rules:
- apiGroups:
  - restart.example.com
  resources:
  - restartplans
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - restart.example.com
  resources:
  - restartplans/status
  verbs:
  - get
